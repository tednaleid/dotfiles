# Global veer rules - applied to every project unless overridden.
# Edit directly, or use `veer add --global` / `veer remove --global`.
# Run `veer list` to see the merged (project + global) view.

# Supply-chain guard: never let the agent fetch and execute a remote script
# in one step. Force it to download, inspect, then run.
[[rule]]
id = "no-curl-pipe-shell"
name = "Block curl piped to a shell"
action = "reject"
message = "Don't pipe curl to bash/sh -- download, inspect, then execute."
[rule.match]
command_all = ["curl", "bash"]

# Claude Code workaround: it treats `echo "---"` as "quoted characters in
# flag names" and prompts for approval; the unquoted `echo ---` is identical
# at the shell level and approval-free. Surgical splice preserves anything
# around it in compound commands.
[[rule]]
id = "echo-separator-unquote"
name = "Drop quotes around --- separators to skip approval prompts"
action = "rewrite"
rewrite_to = "echo ---"
[rule.match]
command = "echo"
arg = "---"

# Plan-quality rule: reject ExitPlanMode when the plan body contains
# "actually". The word almost always indicates the agent changed direction
# mid-plan, leaving the document with a contradiction that confuses whoever
# implements it.
[[rule]]
id = "no-actually-in-plans"
name = "Reject plans that contain 'actually'"
tool = "ExitPlanMode"
action = "reject"
message = "Plans must not contain 'actually' -- it usually means you changed direction mid-plan. Rewrite so the plan reads as one coherent direction."
[rule.match]
content_regex = "[Aa]ctually"

# Attribution guard: MR comments post under my account, so the only thing
# separating the agent's voice from mine is the "From Claude" marker. The
# glab-comment script prepends it, validates the diff anchor, and checks for
# duplicates; a hand-rolled POST does none of that. Reads are unaffected.
[[rule]]
id = "no-raw-glab-mr-comment-post"
name = "Route MR comments through glab-comment"
action = "reject"
message = "Use 'glab-comment' to post MR comments. It prepends the From Claude marker, validates that the line is addressable in the diff, and checks for duplicates. Raw POSTs skip all three."
[rule.match]
command = "glab"
arg_regex = "merge_requests/[0-9]+/(discussions|notes)"
raw_regex = "(-X|--method)[ =]+POST"


# Style rules: no emoji, status-marker glyphs, or em dashes in anything the
# agent writes. The first covers tool input (files, commands, prompts, plans,
# subagent reports); the second checks the finished reply and gives the agent
# one correction turn. Markdown code spans are exempt in replies.
[[rule]]
id = "no-emoji-in-tool-input"
name = "No emoji, status markers, or em dashes in tool input"
tool = "*"
action = "reject"
message = "Do not use emoji, status markers, or em dashes. Use plain words (\"Pass:\", \"Fail:\", \"Note:\") and a hyphen or comma instead of an em dash. If code must contain one of these characters, write it as an escape such as \\u2713."
[rule.match]
content_chars = ["emoji", "status_markers", "emdash"]

[[rule]]
id = "no-emoji-in-replies"
name = "No emoji, status markers, or em dashes in replies"
event = "Stop"
action = "reject"
message = "Your last reply used emoji, status markers, or em dashes. Restate the affected parts in plain words, and put a character in backticks when you need to refer to it."
[rule.match]
content_chars = ["emoji", "status_markers", "emdash"]
